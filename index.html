    <meta name="description" content="檔案不上傳，全部在你的瀏覽器裡完成。媒體播放器、螢幕錄影、GIF 製作、圖片互轉、圖片工具、QR Code、PDF 工具。" />

    <script>
      // 在繪製前套用主題與動畫強度，避免閃爍（內容必須與 stores/settings.ts 一致）
      ;(function () {
        try {
          // 本機伺服器模式（內容必須與 lib/localMode.ts 一致）：設定只存在這個分頁，關閉後不殘留
          var h = location.hostname
          if (/^(localhost|127(?:\.\d{1,3}){3}|\[?::1\]?|0\.0\.0\.0)$/i.test(h) || /\.localhost$/i.test(h)) {
            try {
              var real = window.localStorage
              Object.defineProperty(window, '__realLocalStorage', { value: real })
              Object.defineProperty(window, 'localStorage', { value: window.sessionStorage, configurable: true })
              // 舊版本留在真正 localStorage 的資料一併清除
              Object.keys(real).forEach(function (k) { if (k.indexOf('jayang:') === 0) real.removeItem(k) })
            } catch (e) {}
            document.documentElement.setAttribute('data-local', '')
          }
          var s = JSON.parse(localStorage.getItem('jayang:settings') || '{}').state || {}
          var theme = s.theme || 'auto'
          if (theme === 'auto') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          var motion = s.motion || (matchMedia('(prefers-reduced-motion: reduce)').matches ? 'lite' : 'full')
          var r = document.documentElement
          r.setAttribute('data-theme', theme)
          r.setAttribute('data-motion', motion)
          if (s.lang === 'en') r.lang = 'en'
          var mod = (location.hash.match(/^#\/(player|recorder|gif|convert|tools|stitch|qr|pdfconvert|pdf|doc2pdf)/) || [])[1]
          if (mod) r.setAttribute('data-module', mod)
        } catch (e) {}
      })()
    </script>
