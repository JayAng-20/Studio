<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>JayAng Studio Web</title>
    <meta name="description" content="檔案不上傳，全部在你的瀏覽器裡完成。媒體播放器、螢幕錄影、GIF 製作、圖片互轉、圖片工具、QR Code、PDF 工具。" />
    <meta name="theme-color" content="#F4F5F8" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <script>
      // 在繪製前套用主題與動畫強度，避免閃爍（內容必須與 stores/settings.ts 一致）
      ;(function () {
        try {
          var s = JSON.parse(localStorage.getItem('jayang:settings') || '{}').state || {}
          var theme = s.theme || 'auto'
          if (theme === 'auto') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          var motion = s.motion || (matchMedia('(prefers-reduced-motion: reduce)').matches ? 'lite' : 'full')
          var r = document.documentElement
          r.setAttribute('data-theme', theme)
          r.setAttribute('data-motion', motion)
          if (s.lang === 'en') r.lang = 'en'
          var mod = (location.hash.match(/^#\/(player|recorder|gif|convert|tools|qr|pdf)/) || [])[1]
          if (mod) r.setAttribute('data-module', mod)
        } catch (e) {}
      })()
    </script>
    <style>
      html { background: #f4f5f8; }
      html[data-theme='dark'] { background: #0a0c10; }
      #splash {
        position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center;
        background: #f4f5f8; transition: opacity .45s cubic-bezier(.2,0,0,1), transform .45s cubic-bezier(.2,0,0,1);
      }
      html[data-theme='dark'] #splash { background: #0a0c10; }
      #splash.splash-out { opacity: 0; transform: scale(1.06); pointer-events: none; }
      #splash svg { width: 88px; height: 88px; overflow: visible; }
      #splash .b { transform-box: fill-box; transform-origin: center; animation: sp-in .8s cubic-bezier(.16,1,.3,1) both; }
      #splash .b1 { --dx: 0; --dy: -28px; animation-delay: .05s }
      #splash .b2 { --dx: 28px; --dy: 0; animation-delay: .12s }
      #splash .b3 { --dx: 0; --dy: 28px; animation-delay: .19s }
      #splash .b4 { --dx: -28px; --dy: 0; animation-delay: .26s }
      #splash .c { transform-box: fill-box; transform-origin: center; animation: sp-c .6s cubic-bezier(.34,1.56,.64,1) .35s both; }
      @keyframes sp-in { from { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(-120deg) scale(.6) } to { opacity: 1; transform: none } }
      @keyframes sp-c { from { opacity: 0; transform: scale(.4) } to { opacity: 1; transform: none } }
      html[data-motion='off'] #splash * , html[data-motion='lite'] #splash .b { animation: none !important; }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 64 64">
        <defs>
          <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5AA2FF" /><stop offset="1" stop-color="#2F6BEA" /></linearGradient>
        </defs>
        <rect class="b b1" x="8" y="8" width="34" height="12" rx="4" fill="#22C55E" />
        <rect class="b b2" x="44" y="8" width="12" height="34" rx="4" fill="#F97316" />
        <rect class="b b3" x="22" y="44" width="34" height="12" rx="4" fill="#D946EF" />
        <rect class="b b4" x="8" y="22" width="12" height="34" rx="4" fill="#475569" />
        <g class="c">
          <rect x="22" y="22" width="20" height="20" rx="5" fill="url(#sg)" />
          <path d="M29 26.6v10.8a1 1 0 0 0 1.5.86l8.9-5.4a1 1 0 0 0 0-1.72l-8.9-5.4a1 1 0 0 0-1.5.86Z" fill="#fff" />
        </g>
      </svg>
    </div>
    <div id="root"></div>
    <noscript>這個網站需要啟用 JavaScript 才能使用。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
